<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser / webpage window -->
  <rect x="6" y="9" width="27" height="24" rx="3" fill="none" stroke="#BFF747" stroke-width="2.2"/>
  <!-- Browser top bar -->
  <line x1="6" y1="16" x2="33" y2="16" stroke="#BFF747" stroke-width="2.2"/>
  <circle cx="10.5" cy="12.5" r="1.1" fill="#BFF747"/>
  <circle cx="14.5" cy="12.5" r="1.1" fill="#BFF747"/>
  <circle cx="18.5" cy="12.5" r="1.1" fill="#BFF747"/>

  <!-- Page content lines -->
  <line x1="11" y1="21.5" x2="24" y2="21.5" stroke="#BFF747" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="26" x2="20" y2="26" stroke="#BFF747" stroke-width="2" stroke-linecap="round"/>

  <!-- Magnifying glass over the page -->
  <circle cx="30" cy="30" r="8" fill="none" stroke="#BFF747" stroke-width="2.2"/>
  <line x1="35.7" y1="35.7" x2="42" y2="42" stroke="#BFF747" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Upward ranking arrow inside the lens -->
  <polyline points="26.5,32.5 29,28.5 31.5,30.5 34,25.5" fill="none" stroke="#BFF747" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="31,25.5 34,25.5 34,28.5" fill="none" stroke="#BFF747" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
